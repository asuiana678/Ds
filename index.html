<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RETRO 2DS ARCADE</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* Custom Arcade Typography & Global Tweaks */
        .font-pixel { font-family: 'Press Start 2P', monospace; }
        .font-retro { font-family: 'VT323', monospace; }
        .font-sans { font-family: 'Inter', sans-serif; }

        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.5); }

        /* Disable Text Selection & Touch Actions for Console Feel */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* 2DS Hardware Aesthetics & Skins */
        .console-casing {
            transition: all 0.4s ease;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 2px 4px rgba(255, 255, 255, 0.3), inset 0 -4px 6px rgba(0, 0, 0, 0.4);
        }

        /* Console Skins Definitions */
        .skin-classic-blue { background: linear-gradient(145deg, #1e3c72, #2a5298); border-color: #102a45; }
        .skin-neon-green { background: linear-gradient(145deg, #11998e, #38ef7d); border-color: #0b665e; }
        .skin-bright-yellow { background: linear-gradient(145deg, #f8b500, #fceabb); border-color: #c69200; color: #222; }
        .skin-mario-red { background: linear-gradient(145deg, #e52d27, #b31217); border-color: #800a0e; }
        .skin-jet-black { background: linear-gradient(145deg, #232526, #414345); border-color: #111111; }
        .skin-white { background: linear-gradient(145deg, #e0e0e0, #ffffff); border-color: #b5b5b5; color: #222; }
        .skin-purple { background: linear-gradient(145deg, #8e2de2, #4a00e0); border-color: #320099; }
        .skin-neon-pink { background: linear-gradient(145deg, #ff007f, #ff5252); border-color: #b30059; }
        .skin-orange { background: linear-gradient(145deg, #fc4a1a, #f7b733); border-color: #b8320d; }
        .skin-retro-grey { background: linear-gradient(145deg, #b0bec5, #78909c); border-color: #546e7a; }
        .skin-cyan { background: linear-gradient(145deg, #00c6ff, #0072ff); border-color: #004fb3; }
        .skin-gold { background: linear-gradient(145deg, #bf953f, #fcf6ba, #b38728, #fbf5b7); border-color: #8a641a; color: #332200; }
        .skin-dark-gaming { background: linear-gradient(145deg, #0f2027, #203a43, #2c5364); border-color: #050c0e; }
        
        /* Rainbow RGB Animated Skin */
        .skin-rainbow-rgb {
            background: linear-gradient(124deg, #ff2400, #e81d1d, #e8b71d, #e3e81d, #1de840, #1ddde8, #2b1de8, #dd1de8);
            background-size: 1800% 1800%;
            animation: rainbowSkin 12s ease infinite;
            border-color: #ff007f;
        }
        @keyframes rainbowSkin {
            0%{background-position:0% 82%}
            50%{background-position:100% 19%}
            100%{background-position:0% 82%}
        }

        /* Screen Borders & Bezel */
        .screen-bezel {
            background: #121212;
            border: 4px solid #282828;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.9);
        }

        /* Hardware Controls Styling */
        .dpad-btn {
            background: linear-gradient(145deg, #333, #1a1a1a);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5), inset 1px 1px 1px rgba(255,255,255,0.2);
        }
        .dpad-btn:active, .dpad-btn.active {
            background: #111;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8);
            transform: scale(0.95);
        }

        .action-btn {
            box-shadow: 3px 4px 8px rgba(0,0,0,0.5), inset 1px 2px 3px rgba(255,255,255,0.4);
            transition: transform 0.05s, box-shadow 0.05s;
        }
        .action-btn:active, .action-btn.active {
            transform: translateY(2px) scale(0.95);
            box-shadow: 1px 1px 3px rgba(0,0,0,0.8), inset 0 1px 2px rgba(0,0,0,0.6);
        }

        /* Analog Joystick */
        .joystick-base {
            background: radial-gradient(circle, #2a2a2a 0%, #151515 100%);
            box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
        }
        .joystick-stick {
            background: radial-gradient(circle, #555 0%, #222 100%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.6), inset 0 2px 3px rgba(255,255,255,0.3);
            transition: transform 0.08s ease-out;
        }

        /* Glowing LED Status Indicators */
        .led-power { background: #00ff66; box-shadow: 0 0 8px #00ff66; }
        .led-charging { background: #ff9900; box-shadow: 0 0 8px #ff9900; }
        .led-wifi { background: #00ccff; box-shadow: 0 0 8px #00ccff; }

        /* CRT Screen Scanline Overlay Effect */
        .crt-overlay::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
            opacity: 0.3;
        }

        /* Modal Overlay */
        .modal-bg {
            background-color: rgba(0,0,0,0.75);
            backdrop-filter: blur(4px);
        }

        /* Pulse animations for retro elements */
        @keyframes pixelGlow {
            0%, 100% { text-shadow: 0 0 5px #ff0055, 0 0 10px #ff0055; }
            50% { text-shadow: 0 0 15px #ff0055, 0 0 25px #ff0055; }
        }
        .glow-text { animation: pixelGlow 2s infinite; }
    </style>
</head>

    <!-- MAIN JAVASCRIPT APPLICATION CODE -->
    <script>
        /* ==========================================================================
           1. AUDIO SYNTHESIZER ENGINE (Web Audio API - Pure JS, zero external files)
           ========================================================================== */
        class RetroAudioEngine {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.volume = 0.7;
                this.muted = false;
                this.initialized = false;
            }

            init() {
                if (this.initialized) return;
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.value = this.volume;
                    this.masterGain.connect(this.ctx.destination);
                    this.initialized = true;
                } catch(e) {
                    console.warn("Web Audio API not supported.");
                }
            }

            setVolume(val) {
                this.volume = val;
                if (this.masterGain) {
                    this.masterGain.gain.value = this.muted ? 0 : this.volume;
                }
            }

            playTone(freq, type, duration, delay = 0) {
                if (!this.initialized || this.muted) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + delay + duration);
                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start(this.ctx.currentTime + delay);
                    osc.stop(this.ctx.currentTime + delay + duration);
                } catch(e){}
            }

            // Sound Effect Presets
            playSfx(type) {
                this.init();
                if (!this.initialized) return;
                
                switch(type) {
                    case 'click':
                        this.playTone(400, 'square', 0.05);
                        break;
                    case 'jump':
                        this.playTone(150, 'square', 0.1);
                        this.playTone(300, 'square', 0.15, 0.05);
                        break;
                    case 'coin':
                        this.playTone(987.77, 'sine', 0.08); // B5
                        this.playTone(1318.51, 'sine', 0.25, 0.08); // E6
                        break;
                    case 'shoot':
                        this.playTone(800, 'sawtooth', 0.05);
                        this.playTone(200, 'sawtooth', 0.1, 0.03);
                        break;
                    case 'hit':
                        this.playTone(120, 'sawtooth', 0.15);
                        break;
                    case 'victory':
                        [440, 554, 659, 880].forEach((f, i) => this.playTone(f, 'triangle', 0.2, i * 0.12));
                        break;
                    case 'defeat':
                        [400, 350, 300, 250].forEach((f, i) => this.playTone(f, 'sawtooth', 0.2, i * 0.15));
                        break;
                }
            }
        }

        const audio = new RetroAudioEngine();

        /* ==========================================================================
           2. GLOBAL SYSTEM STATE & PERSISTENCE (LocalStorage)
           ========================================================================== */
        const DEFAULT_STATE = {
            account: {
                username: 'Player1',
                level: 1,
                xp: 0,
                coins: 250,
                wins: 0,
                losses: 0,
                avatar: '🎮',
                unlockedSkins: ['skin-classic-blue'],
                activeSkin: 'skin-classic-blue',
                achievements: []
            },
            highScores: {
                mario: 0,
                football: 0,
                chess: 0,
                tictactoe: 0,
                zombie: 0,
                plant: 0,
                runner: 0,
                retroHub: 0
            },
            settings: {
                volume: 70,
                crtEffect: true
            }
        };

        let appState = JSON.parse(localStorage.getItem('RETRO_2DS_DATA')) || DEFAULT_STATE;

        function saveAppState() {
            localStorage.setItem('RETRO_2DS_DATA', JSON.stringify(appState));
            updateHeaderUI();
        }

        function showToast(msg) {
            const toast = document.getElementById('toastMessage');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }

        function addCoins(amount) {
            appState.account.coins += amount;
            appState.account.xp += amount * 2;
            // Level up logic
            const nextLevelXp = appState.account.level * 100;
            if (appState.account.xp >= nextLevelXp) {
                appState.account.level++;
                showToast(`LEVEL UP! REACHED LEVEL ${appState.account.level}`);
                audio.playSfx('victory');
            }
            saveAppState();
        }

        /* ==========================================================================
           3. SHOP & CONSOLE SKINS DEFINITIONS
           ========================================================================== */
        const SKINS_DATABASE = [
            { id: 'skin-classic-blue', name: 'Classic Blue', cost: 0, rarity: 'Common' },
            { id: 'skin-neon-green', name: 'Neon Green', cost: 100, rarity: 'Common' },
            { id: 'skin-bright-yellow', name: 'Bright Yellow', cost: 150, rarity: 'Common' },
            { id: 'skin-mario-red', name: 'Mario Red', cost: 200, rarity: 'Rare' },
            { id: 'skin-jet-black', name: 'Jet Black', cost: 250, rarity: 'Rare' },
            { id: 'skin-white', name: 'Pure White', cost: 250, rarity: 'Rare' },
            { id: 'skin-purple', name: 'Neon Purple', cost: 300, rarity: 'Rare' },
            { id: 'skin-neon-pink', name: 'Cyber Pink', cost: 350, rarity: 'Rare' },
            { id: 'skin-orange', name: 'Arcade Orange', cost: 400, rarity: 'Epic' },

            audio.playSfx('click');
            const btnEl = document.getElementById('btn' + btn);
            if (btnEl) btnEl.classList.add('active');
            keysPressed[btn] = true;
            if (activeGameInstance && activeGameInstance.handleInput) {
                activeGameInstance.handleInput(btn, true);
            }
        }

        function handleControlUp(btn) {
            const btnEl = document.getElementById('btn' + btn);
            if (btnEl) btnEl.classList.remove('active');
            keysPressed[btn] = false;
            if (activeGameInstance && activeGameInstance.handleInput) {

        }

        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            switch(e.key) {
                case 'ArrowUp': case 'w': case 'W': handleControlDown('Up'); break;
                case 'ArrowDown': case 's': case 'S': handleControlDown('Down'); break;
                case 'ArrowLeft': case 'a': case 'A': handleControlDown('Left'); break;
                case 'ArrowRight': case 'd': case 'D': handleControlDown('Right'); break;
                case 'j': case 'J': case ' ': handleControlDown('A'); break;
                case 'k': case 'K': handleControlDown('B'); break;
                case 'u': case 'U': handleControlDown('X'); break;
                case 'i': case 'I': handleControlDown('Y'); break;
                case 'Enter': triggerSystemButton('START'); break;
                case 'Escape': triggerSystemButton('SELECT'); break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch(e.key) {
                case 'ArrowUp': case 'w': case 'W': handleControlUp('Up'); break;
                case 'ArrowDown': case 's': case 'S': handleControlUp('Down'); break;
                case 'ArrowLeft': case 'a': case 'A': handleControlUp('Left'); break;
                case 'ArrowRight': case 'd': case 'D': handleControlUp('Right'); break;
                case 'j': case 'J': case ' ': handleControlUp('A'); break;
                case 'k': case 'K': handleControlUp('B'); break;
                case 'u': case 'U': handleControlUp('X'); break;
                case 'i': case 'I': handleControlUp('Y'); break;
            }
        });

        // Analog Joystick Touch/Mouse Drag Simulation
        const joystickStick = document.getElementById('joystickStick');
        const joystickBase = document.getElementById('joystickBase');
        let draggingJoystick = false;

        function updateJoystick(clientX, clientY) {
            const rect = joystickBase.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = clientX - centerX;
            let dy = clientY - centerY;
            const distance = Math.hypot(dx, dy);
            const maxRadius = rect.width / 2 - 10;

            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }

            joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;

            // Map Joystick Displacement to D-Pad Controls
            if (dx < -15) handleControlDown('Left'); else handleControlUp('Left');
            if (dx > 15) handleControlDown('Right'); else handleControlUp('Right');
            if (dy < -15) handleControlDown('Up'); else handleControlUp('Up');
            if (dy > 15) handleControlDown('Down'); else handleControlUp('Down');
        }

        joystickBase.addEventListener('mousedown', (e) => { draggingJoystick = true; updateJoystick(e.clientX, e.clientY); });
        window.addEventListener('mousemove', (e) => { if (draggingJoystick) updateJoystick(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => {
            if (draggingJoystick) {
                draggingJoystick = false;
                joystickStick.style.transform = `translate(0px, 0px)`;
                ['Up', 'Down', 'Left', 'Right'].forEach(handleControlUp);
            }
        });

        joystickBase.addEventListener('touchstart', (e) => { draggingJoystick = true; updateJoystick(e.touches[0].clientX, e.touches[0].clientY); });
        window.addEventListener('touchmove', (e) => { if (draggingJoystick) updateJoystick(e.touches[0].clientX, e.touches[0].clientY); });
        window.addEventListener('touchend', () => {
            if (draggingJoystick) {
                draggingJoystick = false;
                joystickStick.style.transform = `translate(0px, 0px)`;
                ['Up', 'Down', 'Left', 'Right'].forEach(handleControlUp);
            }
        });

        /* --------------------------------------------------------------------------
           GAME 1: SUPER MARIO-STYLE 2.5D PLATFORM ADVENTURE
           -------------------------------------------------------------------------- */
        class Mario3DGame {
            constructor(canvas, context) {
                this.canvas = canvas;
                this.ctx = context;
                this.running = false;
                this.score = 0;
                this.coins = 0;
                this.player = {
                    x: 50, y: 100, w: 24, h: 32,
                    vx: 0, vy: 0,
                    grounded: false,
                    isBig: false
                };
                this.cameraX = 0;
                this.platforms = [
                    { x: 0, y: 200, w: 600, h: 40 },
                    { x: 250, y: 140, w: 100, h: 20 },
                    { x: 450, y: 110, w: 120, h: 20 },
                    { x: 680, y: 180, w: 500, h: 40 },
                    { x: 850, y: 120, w: 80, h: 20 },
                    { x: 1050, y: 140, w: 200, h: 40 }
                ];
                this.coinsList = [
                    { x: 270, y: 110, collected: false },
                    { x: 300, y: 110, collected: false },
                    { x: 480, y: 80, collected: false },
                    { x: 720, y: 150, collected: false },
                    { x: 880, y: 90, collected: false }
                ];
                this.boss = { x: 1150, y: 90, w: 40, h: 50, hp: 3, maxHp: 3, alive: true, vx: -1 };
            }

            start() {
                this.running = true;
                this.loop();
            }

            stop() {
                this.running = false;
            }

            handleInput(btn, isDown) {
                if (!isDown) {
                    if (btn === 'Left' || btn === 'Right') this.player.vx = 0;
                    return;
                }
                if (btn === 'Left') this.player.vx = -3.5;
                if (btn === 'Right') this.player.vx = 3.5;
                if ((btn === 'A' || btn === 'Up') && this.player.grounded) {
                    this.player.vy = -9.5;
                    this.player.grounded = false;
                    audio.playSfx('jump');
                }
            }

            update() {
                // Gravity & Movement
                this.player.vy += 0.45;
                this.player.x += this.player.vx;
                this.player.y += this.player.vy;

                // Platform Collisions
                this.player.grounded = false;
                this.platforms.forEach(p => {
                    if (this.player.x + this.player.w > p.x &&
                        this.player.x < p.x + p.w &&
                        this.player.y + this.player.h >= p.y &&
                        this.player.y + this.player.h <= p.y + 12 &&
                        this.player.vy >= 0) {
                        this.player.grounded = true;
                        this.player.vy = 0;
                        this.player.y = p.y - this.player.h;
                    }
                });

                // Scroll Camera
                this.cameraX = this.player.x - 100;

                // Coin Collection
                this.coinsList.forEach(c => {
                    if (!c.collected && Math.hypot(this.player.x - c.x, this.player.y - c.y) < 25) {
                        c.collected = true;
                        this.coins++;
                        this.score += 100;
                        addCoins(1);
                        audio.playSfx('coin');
                    }
                });

                // Boss Logic
                if (this.boss.alive) {
                    this.boss.x += this.boss.vx;
                    if (this.boss.x < 1050 || this.boss.x > 1200) this.boss.vx *= -1;

                    // Stomp Boss Collision
                    if (this.player.x + this.player.w > this.boss.x &&
                        this.player.x < this.boss.x + this.boss.w &&
                        this.player.y + this.player.h >= this.boss.y &&
                        this.player.y + this.player.h <= this.boss.y + 15 &&
                        this.player.vy > 0) {
                        this.boss.hp--;
                        this.player.vy = -7;
                        audio.playSfx('hit');
                        if (this.boss.hp <= 0) {
                            this.boss.alive = false;
                            this.score += 1000;
                            addCoins(50);
                            unlockAchievement('mario_boss');
                            showToast("BOSS DEFEATED! LEVEL CLEAR!");
                        }
                    }
                }

                // Fall Off World Reset
                if (this.player.y > this.canvas.height + 100) {
                    this.player.x = 50;
                    this.player.y = 100;
                    this.player.vy = 0;
                    audio.playSfx('defeat');
                }

                // Update High Score
                if (this.score > appState.highScores.mario) {
                    appState.highScores.mario = this.score;
                    saveAppState();
                }
            }

            draw() {
                this.ctx.fillStyle = '#38bdf8'; // Sky Blue
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.save();
                this.ctx.translate(-this.cameraX, 0);

                // Draw Platforms
                this.platforms.forEach(p => {
                    this.ctx.fillStyle = '#22c55e';
                    this.ctx.fillRect(p.x, p.y, p.w, 6);
                    this.ctx.fillStyle = '#78350f';
                    this.ctx.fillRect(p.x, p.y + 6, p.w, p.h - 6);
                });

                // Draw Coins
                this.coinsList.forEach(c => {
                    if (!c.collected) {
                        this.ctx.fillStyle = '#eab308';
                        this.ctx.beginPath();
                        this.ctx.arc(c.x, c.y, 6, 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                });

                // Draw Boss
                if (this.boss.alive) {
                    this.ctx.fillStyle = '#dc2626';
                    this.ctx.fillRect(this.boss.x, this.boss.y, this.boss.w, this.boss.h);
                    // Boss HP Bar
                    this.ctx.fillStyle = '#000';
                    this.ctx.fillRect(this.boss.x, this.boss.y - 12, this.boss.w, 5);
                    this.ctx.fillStyle = '#22c55e';
                    this.ctx.fillRect(this.boss.x, this.boss.y - 12, (this.boss.hp / this.boss.maxHp) * this.boss.w, 5);
                }

                // Draw Mario Player
                this.ctx.fillStyle = '#ef4444';
                this.ctx.fillRect(this.player.x, this.player.y, this.player.w, this.player.h);
                this.ctx.fillStyle = '#3b82f6';
                this.ctx.fillRect(this.player.x, this.player.y + 16, this.player.w, 16);

                this.ctx.restore();

                // UI Overlay
                this.ctx.fillStyle = '#fff';
                this.ctx.font = '10px "Press Start 2P"';
                this.ctx.fillText(`SCORE: ${this.score}`, 10, 20);
                this.ctx.fillText(`COINS: ${this.coins}`, 10, 35);
            }

            loop() {
                if (!this.running) return;
                if (!isPaused) {
                    this.update();
                    this.draw();
                }
                requestAnimationFrame(() => this.loop());
            }
        }

        /* --------------------------------------------------------------------------
           GAME 2: FOOTBALL ARCADE
           -------------------------------------------------------------------------- */
        class FootballGame {
            constructor(canvas, context) {
                this.canvas = canvas;
                this.ctx = context;
                this.running = false;
                this.player = { x: 100, y: 100, r: 10, speed: 2.5 };
                this.ball = { x: 200, y: 120, vx: 0, vy: 0, r: 6 };
                this.scorePlayer = 0;
                this.scoreAI = 0;
                this.ai = { x: 300, y: 120, r: 10, speed: 1.8 };
            }

            start() { this.running = true; this.loop(); }
            stop() { this.running = false; }

            handleInput(btn, isDown) {
                if (!isDown) return;
                if (btn === 'Left') this.player.x -= 10;
                if (btn === 'Right') this.player.x += 10;
                if (btn === 'Up') this.player.y -= 10;
                if (btn === 'Down') this.player.y += 10;
                if (btn === 'A') { // Kick Ball
                    const dist = Math.hypot(this.player.x - this.ball.x, this.player.y - this.ball.y);
                    if (dist < 25) {
                        this.ball.vx = 6;
                        this.ball.vy = (Math.random() - 0.5) * 4;
                        audio.playSfx('shoot');
                    }
                }
            }

            update() {
                // Ball Friction Physics
                this.ball.x += this.ball.vx;
                this.ball.y += this.ball.vy;
                this.ball.vx *= 0.96;
                this.ball.vy *= 0.96;

                // AI Movement towards Ball
                if (this.ai.x > this.ball.x) this.ai.x -= this.ai.speed;
                else this.ai.x += this.ai.speed;
                if (this.ai.y > this.ball.y) this.ai.y -= this.ai.speed;
                else this.ai.y += this.ai.speed;

                // Goal Detection
                if (this.ball.x > this.canvas.width - 10) {
                    this.scorePlayer++;
                    audio.playSfx('victory');
                    this.resetBall();
                } else if (this.ball.x < 10) {
                    this.scoreAI++;
                    audio.playSfx('defeat');
                    this.resetBall();
                }
            }

            resetBall() {
                this.ball.x = this.canvas.width / 2;
                this.ball.y = this.canvas.height / 2;
                this.ball.vx = 0; this.ball.vy = 0;
            }

            draw() {
                // Pitch Background
                this.ctx.fillStyle = '#15803d';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.strokeStyle = '#fff';
                this.ctx.strokeRect(10, 10, this.canvas.width - 20, this.canvas.height - 20);

                // Player (Blue)
                this.ctx.fillStyle = '#3b82f6';
                this.ctx.beginPath(); this.ctx.arc(this.player.x, this.player.y, this.player.r, 0, Math.PI*2); this.ctx.fill();

                // AI (Red)
                this.ctx.fillStyle = '#ef4444';
                this.ctx.beginPath(); this.ctx.arc(this.ai.x, this.ai.y, this.ai.r, 0, Math.PI*2); this.ctx.fill();

                // Football
                this.ctx.fillStyle = '#ffffff';
                this.ctx.beginPath(); this.ctx.arc(this.ball.x, this.ball.y, this.ball.r, 0, Math.PI*2); this.ctx.fill();

                // Scoreboard Overlay
                this.ctx.fillStyle = '#fff';
                this.ctx.font = '10px "Press Start 2P"';
                this.ctx.fillText(`PLAYER: ${this.scorePlayer}  AI: ${this.scoreAI}`, 20, 30);
            }

            loop() {
                if (!this.running) return;
                if (!isPaused) { this.update(); this.draw(); }
                requestAnimationFrame(() => this.loop());
            }
        }

        /* --------------------------------------------------------------------------
           GAME 3: CHESS ENGINE
           -------------------------------------------------------------------------- */
        class ChessGame {
            constructor(canvas, context) {
                this.canvas = canvas;
                this.ctx = context;
                this.running = false;
                this.selectedSquare = null;
                this.board = [
                    ['r','n','b','q','k','b','n','r'],
                    ['p','p','p','p','p','p','p','p'],
                    ['','','','','','','',''],
                    ['','','','','','','',''],
                    ['','','','','','','',''],
                    ['','','','','','','',''],
                    ['P','P','P','P','P','P','P','P'],
                    ['R','N','B','Q','K','B','N','R']
                ];
                this.cursor = { r: 6, c: 4 };
            }

            start() { this.running = true; this.loop(); }
            stop() { this.running = false; }

            handleInput(btn, isDown) {
                if (!isDown) return;
                if (btn === 'Left') this.cursor.c = Math.max(0, this.cursor.c - 1);
                if (btn === 'Right') this.cursor.c = Math.min(7, this.cursor.c + 1);
                if (btn === 'Up') this.cursor.r = Math.max(0, this.cursor.r - 1);
                if (btn === 'Down') this.cursor.r = Math.min(7, this.cursor.r + 1);
                if (btn === 'A') {
                    if (!this.selectedSquare) {
                        this.selectedSquare = { ...this.cursor };
                    } else {
                        // Perform Move
                        const p = this.board[this.selectedSquare.r][this.selectedSquare.c];
                        this.board[this.cursor.r][this.cursor.c] = p;
                        this.board[this.selectedSquare.r][this.selectedSquare.c] = '';
                        this.selectedSquare = null;
                        audio.playSfx('click');
                    }
                }
            }

            draw() {
                const tileSize = Math.min(this.canvas.width, this.canvas.height) / 8;
                const offsetX = (this.canvas.width - tileSize * 8) / 2;

                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        this.ctx.fillStyle = (r + c) % 2 === 0 ? '#f0d9b5' : '#b58863';
                        this.ctx.fillRect(offsetX + c * tileSize, r * tileSize, tileSize, tileSize);

                        // Highlight Cursor & Selection
                        if (this.cursor.r === r && this.cursor.c === c) {
                            this.ctx.strokeStyle = '#ef4444';
                            this.ctx.lineWidth = 3;
                            this.ctx.strokeRect(offsetX + c * tileSize, r * tileSize, tileSize, tileSize);
                        }

                        const piece = this.board[r][c];
                        if (piece) {
                            this.ctx.fillStyle = piece === piece.toUpperCase() ? '#000' : '#fff';
                            this.ctx.font = `${tileSize * 0.6}px sans-serif`;
                            this.ctx.textAlign = 'center';
                            this.ctx.fillText(piece, offsetX + c * tileSize + tileSize/2, r * tileSize + tileSize * 0.7);
                        }
                    }
                }
            }

            loop() {
                if (!this.running) return;
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        }

        /* --------------------------------------------------------------------------
           GAME 4: TIC TAC TOE
           -------------------------------------------------------------------------- */
        class TicTacToeGame {
            constructor(canvas, context) {
                this.canvas = canvas;
                this.ctx = context;
                this.running = false;
                this.grid = Array(9).fill('');
                this.cursor = 4;
                this.turn = 'X';
            }

            start() { this.running = true; this.loop(); }
            stop() { this.running = false; }

            handleInput(btn, isDown) {
                if (!isDown) return;
                if (btn === 'Left') this.cursor = (this.cursor + 8) % 9;
                if (btn === 'Right') this.cursor = (this.cursor + 1) % 9;
                if (btn === 'A' && this.grid[this.cursor] === '') {
                    this.grid[this.cursor] = 'X';
                    audio.playSfx('click');
                    this.aiMove();
                }
            }

            aiMove() {
                const emptyIdx = this.grid.map((v, i) => v === '' ? i : null).filter(v => v !== null);
                if (emptyIdx.length > 0) {
                    const pick = emptyIdx[Math.floor(Math.random() * emptyIdx.length)];
                    this.grid[pick] = 'O';
                }
            }

            draw() {
                this.ctx.fillStyle = '#0f172a';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                const size = 60;
                const startX = (this.canvas.width - size * 3) / 2;
                const startY = (this.canvas.height - size * 3) / 2;

                for (let i = 0; i < 9; i++) {
                    const r = Math.floor(i / 3);
                    const c = i % 3;
                    const x = startX + c * size;
                    const y = startY + r * size;

                    this.ctx.strokeStyle = '#38bdf8';
                    this.ctx.strokeRect(x, y, size, size);

                    if (this.cursor === i) {
                        this.ctx.fillStyle = 'rgba(250, 204, 21, 0.3)';
                        this.ctx.fillRect(x, y, size, size);
                    }

                    this.ctx.fillStyle = '#fff';
                    this.ctx.font = '24px "Press Start 2P"';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(this.grid[i], x + size/2, y + size/2 + 8);
                }
            }

            loop() {
                if (!this.running) return;
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        }

        /* --------------------------------------------------------------------------
           GAME 5: ZOMBIE SURVIVAL SHOOTER
           -------------------------------------------------------------------------- */
        class ZombieGame {
            constructor(canvas, context) {
                this.canvas = canvas;
                this.ctx = context;
                this.running = false;
                this.player = { x: 150, y: 100, hp: 100 };
                this.bullets = [];
                this.zombies = [];
                this.score = 0;
            }

            start() { this.running = true; this.loop(); }
            stop() { this.running = false; }

            handleInput(btn, isDown) {
                if (!isDown) return;
                if (btn === 'Left') this.player.x -= 8;
                if (btn === 'Right') this.player.x += 8;
                if (btn === 'Up') this.player.y -= 8;
                if (btn === 'Down') this.player.y += 8;
                if (btn === 'A') {
                    this.bullets.push({ x: this.player.x, y: this.player.y, vx: 5, vy: 0 });
                    audio.playSfx('shoot');
                }
            }

            update() {
                // Spawn Zombies
                if (Math.random() < 0.03) {
                    this.zombies.push({ x: this.canvas.width + 10, y: Math.random() * this.canvas.height, hp: 2 });
                }

                // Bullet Physics
                this.bullets.forEach(b => b.x += b.vx);

                // Zombie AI
                this.zombies.forEach(z => {
                    z.x -= 1.2;
                    // Collision with Bullet
                    this.bullets.forEach((b, bi) => {
                        if (Math.hypot(b.x - z.x, b.y - z.y) < 15) {
                            z.hp--;
                            this.bullets.splice(bi, 1);
                            if (z.hp <= 0) {
                                this.score += 50;
                                addCoins(2);
                            }
                        }
                    });
                });

                this.zombies = this.zombies.filter(z => z.hp > 0 && z.x > -20);
            }

            draw() {
                this.ctx.fillStyle = '#18181b';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Player
                this.ctx.fillStyle = '#3b82f6';
                this.ctx.beginPath(); this.ctx.arc(this.player.x, this.player.y, 8, 0, Math.PI*2); this.ctx.fill();

                // Bullets
                this.ctx.fillStyle = '#facc15';
                this.bullets.forEach(b => {
                    this.ctx.fillRect(b.x, b.y - 2, 6, 4);
                });

                // Zombies
                this.ctx.fillStyle = '#22c55e';
                this.zombies.forEach(z => {
                    this.ctx.beginPath(); this.ctx.arc(z.x, z.y, 10, 0, Math.PI*2); this.ctx.fill();
                });

                // UI
                this.ctx.fillStyle = '#fff';
                this.ctx.font = '10px "Press Start 2P"';
                this.ctx.fillText(`SCORE: ${this.score}`, 10, 20);
            }

            loop() {
                if (!this.running) return;
                if (!isPaused) { this.update(); this.draw(); }
                requestAnimationFrame(() => this.loop());
            }
        }

        /* --------------------------------------------------------------------------
           GAME 6: PLANT DEFENSE TOWER GAME
           -------------------------------------------------------------------------- */
        class PlantDefenseGame {
            constructor(canvas, context) {
                this.canvas = canvas;
                this.ctx = context;
                this.running = false;
                this.sun = 100;
                this.plants = [];
                this.zombies = [];
            }

            start() { this.running = true; this.loop(); }
            stop() { this.running = false; }

            handleInput(btn, isDown) {
                if (isDown && btn === 'A' && this.sun >= 50) {
                    this.sun -= 50;
                    this.plants.push({ x: 50 + Math.random()*100, y: 50 + Math.random()*100 });
                    audio.playSfx('click');
                }
            }

            update() {
                if (Math.random() < 0.02) {
                    this.zombies.push({ x: this.canvas.width, y: 50 + Math.floor(Math.random()*3)*40 });
                }
                this.zombies.forEach(z => z.x -= 0.8);
            }

            draw() {
                this.ctx.fillStyle = '#166534';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Plants
                this.ctx.fillStyle = '#facc15';
                this.plants.forEach(p => {
                    this.ctx.beginPath(); this.ctx.arc(p.x, p.y, 12, 0, Math.PI*2); this.ctx.fill();
                });

                // Zombies
                this.ctx.fillStyle = '#94a3b8';
                this.zombies.forEach(z => {
                    this.ctx.fillRect(z.x, z.y - 10, 15, 20);
                });

                this.ctx.fillStyle = '#fff';
                this.ctx.font = '10px "Press Start 2P"';
                this.ctx.fillText(`SUN: ${this.sun}`, 10, 20);
            }

            loop() {
                if (!this.running) return;
                if (!isPaused) { this.update(); this.draw(); }
                requestAnimationFrame(() => this.loop());
            }
        }

        /* --------------------------------------------------------------------------
           GAME 7: SUBWAY ENDLESS RUNNER
           -------------------------------------------------------------------------- */
        class SubwayRunnerGame {
            constructor(canvas, context) {
                this.canvas = canvas;
                this.ctx = context;
                this.running = false;
                this.lane = 1; // 0, 1, 2
                this.score = 0;
                this.obstacles = [];
            }

            start() { this.running = true; this.loop(); }
            stop() { this.running = false; }

            handleInput(btn, isDown) {
                if (!isDown) return;
                if (btn === 'Left') this.lane = Math.max(0, this.lane - 1);
                if (btn === 'Right') this.lane = Math.min(2, this.lane + 1);
            }

            update() {
                this.score++;
                if (Math.random() < 0.03) {
                    this.obstacles.push({ lane: Math.floor(Math.random()*3), z: 200 });
                }
                this.obstacles.forEach(o => o.z -= 4);
                this.obstacles = this.obstacles.filter(o => o.z > 0);
            }

            draw() {
                this.ctx.fillStyle = '#0284c7';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw 3 Lanes
                const laneW = this.canvas.width / 3;
                this.ctx.strokeStyle = '#fff';
                this.ctx.strokeRect(laneW, 0, laneW, this.canvas.height);

                // Player
                this.ctx.fillStyle = '#e11d48';
                this.ctx.fillRect(this.lane * laneW + laneW/2 - 10, this.canvas.height - 40, 20, 30);

                // Obstacles
                this.ctx.fillStyle = '#f59e0b';
                this.obstacles.forEach(o => {
                    this.ctx.fillRect(o.lane * laneW + laneW/2 - 15, o.z, 30, 20);
                });

                this.ctx.fillStyle = '#fff';
                this.ctx.font = '10px "Press Start 2P"';
                this.ctx.fillText(`DIST: ${this.score}M`, 10, 20);
            }

            loop() {
                if (!this.running) return;
                if (!isPaused) { this.update(); this.draw(); }
                requestAnimationFrame(() => this.loop());
            }
        }

        /* --------------------------------------------------------------------------
           GAME 8: RETRO SNAKE ARCADE
           -------------------------------------------------------------------------- */
        class SnakeArcadeGame {
            constructor(canvas, context) {
                this.canvas = canvas;
                this.ctx = context;
                this.running = false;
                this.snake = [{x: 5, y: 5}];
                this.dir = {x: 1, y: 0};
                this.food = {x: 10, y: 8};
                this.score = 0;
            }

            start() { this.running = true; this.loop(); }
            stop() { this.running = false; }

            handleInput(btn, isDown) {
                if (!isDown) return;
                if (btn === 'Left' && this.dir.x === 0) this.dir = {x: -1, y: 0};
                if (btn === 'Right' && this.dir.x === 0) this.dir = {x: 1, y: 0};
                if (btn === 'Up' && this.dir.y === 0) this.dir = {x: 0, y: -1};
                if (btn === 'Down' && this.dir.y === 0) this.dir = {x: 0, y: 1};
            }

            update() {
                const head = { x: this.snake[0].x + this.dir.x, y: this.snake[0].y + this.dir.y };
                this.snake.unshift(head);
                if (head.x === this.food.x && head.y === this.food.y) {
                    this.score += 10;
                    this.food = { x: Math.floor(Math.random()*15), y: Math.floor(Math.random()*10) };
                    audio.playSfx('coin');
                } else {
                    this.snake.pop();
                }
            }

            draw() {
                this.ctx.fillStyle = '#0f172a';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                const grid = 15;

                // Snake Body
                this.ctx.fillStyle = '#22c55e';
                this.snake.forEach(s => this.ctx.fillRect(s.x * grid, s.y * grid, grid-2, grid-2));

                // Food
                this.ctx.fillStyle = '#ef4444';
                this.ctx.fillRect(this.food.x * grid, this.food.y * grid, grid-2, grid-2);

                this.ctx.fillStyle = '#fff';
                this.ctx.font = '10px "Press Start 2P"';
                this.ctx.fillText(`SCORE: ${this.score}`, 10, 20);
            }

            loop() {
                if (!this.running) return;
                if (!isPaused) { this.update(); this.draw(); }
                setTimeout(() => requestAnimationFrame(() => this.loop()), 150);
            }
        }

        /* ==========================================================================
           8. APPLICATION INITIALIZATION
           ========================================================================== */
        window.onload = function() {
            navigateView('home');
            updateHeaderUI();
        };
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RETRO 2DS ARCADE</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Retro Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        .font-pixel { font-family: 'Press Start 2P', monospace; }
        .font-retro { font-family: 'VT323', monospace; }
        .font-sans { font-family: 'Inter', sans-serif; }

        .no-select {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* 1:1 Nintendo 2DS Chassis Skins */
        .chassis-base {
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), inset 0 2px 4px rgba(255, 255, 255, 0.4), inset 0 -6px 8px rgba(0, 0, 0, 0.35);
            border-style: solid;
        }

        .skin-pink { background: linear-gradient(165deg, #ffb6c1, #ff99ac); border-color: #f67280; color: #4a1525; }
        .skin-red-white { background: linear-gradient(165deg, #f8f9fa, #e9ecef); border-color: #dc3545; color: #212529; }
        .skin-black-blue { background: linear-gradient(165deg, #2b2d42, #1a1a24); border-color: #0077b6; color: #f8f9fa; }
        .skin-classic-blue { background: linear-gradient(165deg, #1e3c72, #2a5298); border-color: #0f2042; color: #fff; }
        .skin-mario-red { background: linear-gradient(165deg, #e52d27, #b31217); border-color: #7a0b0e; color: #fff; }
        .skin-neon-green { background: linear-gradient(165deg, #11998e, #38ef7d); border-color: #0b5e56; color: #052c28; }
        .skin-bright-yellow { background: linear-gradient(165deg, #f8b500, #fceabb); border-color: #ca9400; color: #332700; }
        .skin-jet-black { background: linear-gradient(165deg, #232526, #414345); border-color: #111111; color: #fff; }
        .skin-white { background: linear-gradient(165deg, #ffffff, #e2e8f0); border-color: #cbd5e1; color: #0f172a; }
        .skin-purple { background: linear-gradient(165deg, #6b21a8, #3b0764); border-color: #581c87; color: #fff; }
        .skin-orange { background: linear-gradient(165deg, #ea580c, #c2410c); border-color: #9a3412; color: #fff; }
        .skin-cyan { background: linear-gradient(165deg, #06b6d4, #0e7490); border-color: #155e75; color: #fff; }
        .skin-retro-grey { background: linear-gradient(165deg, #cfd8dc, #90a4ae); border-color: #607d8b; color: #263238; }
        .skin-gold { background: linear-gradient(165deg, #bf953f, #fcf6ba, #b38728); border-color: #8c6a1d; color: #3a2a07; }
        .skin-dark-gaming { background: linear-gradient(165deg, #09090b, #18181b); border-color: #27272a; color: #38bdf8; }
        .skin-rainbow-rgb {
            background: linear-gradient(124deg, #ff2400, #e81d1d, #e8b71d, #1de840, #1ddde8, #2b1de8, #dd1de8);
            background-size: 1800% 1800%;
            animation: rainbowAnim 8s ease infinite;
            border-color: #ff007f;
            color: #fff;
        }
        @keyframes rainbowAnim {
            0%{background-position:0% 82%}
            50%{background-position:100% 19%}
            100%{background-position:0% 82%}
        }

        .screen-bezel-top {
            background: #111113;
            border: 4px solid #232328;
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.95);
        }
        .screen-bezel-bottom {
            background: #161619;
            border: 4px solid #28282d;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9);
        }

        .hardware-btn {
            background: linear-gradient(145deg, #f0f0f0, #cccccc);
            box-shadow: 2px 3px 6px rgba(0,0,0,0.4), inset 1px 1px 2px rgba(255,255,255,0.8);
            color: #333;
            font-weight: bold;
            transition: all 0.05s ease;
        }
        .hardware-btn:active, .hardware-btn.active {
            transform: translateY(2px) scale(0.96);
            box-shadow: 1px 1px 3px rgba(0,0,0,0.6), inset 0 2px 4px rgba(0,0,0,0.4);
        }

        .circle-pad-outer {
            background: radial-gradient(circle, #e6e6e6 0%, #b3b3b3 70%, #808080 100%);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6), 0 4px 8px rgba(0,0,0,0.3);
            border: 2px solid #888;
        }
        .circle-pad-inner {
            background: radial-gradient(circle, #f5f5f5 0%, #d9d9d9 60%, #a6a6a6 100%);
            box-shadow: 0 4px 6px rgba(0,0,0,0.4), inset 0 2px 3px rgba(255,255,255,0.9);
            transition: transform 0.06s ease-out;
        }

        .dpad-cross-btn {
            background: linear-gradient(145deg, #e6e6e6, #cccccc);
            box-shadow: 2px 2px 4px rgba(0,0,0,0.3), inset 1px 1px 1px rgba(255,255,255,0.8);
        }
        .dpad-cross-btn:active, .dpad-cross-btn.active {
            background: #b3b3b3;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.6);
        }

        .led-power { background: #00ff66; box-shadow: 0 0 8px #00ff66; }
        .led-wifi { background: #00d2ff; box-shadow: 0 0 8px #00d2ff; }
        .led-charge { background: #ff9900; box-shadow: 0 0 8px #ff9900; }

        .crt-scanlines::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
            opacity: 0.25;
        }

        .stylus-active {
            cursor: crosshair !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 font-sans no-select overflow-x-hidden">

                    <div class="w-1.5 h-1.5 rounded-full bg-black/60"></div>
                    <div class="w-1.5 h-1.5 rounded-full bg-black/60"></div>

        <!-- TOP DISPLAY SCREEN (5:3 LCD Display) -->

            <div class="relative w-full aspect-[5/3] bg-black rounded-lg overflow-hidden flex flex-col items-center justify-center">

                <!-- Notification Toast -->

        <!-- LOWER CONTROLS & TOUCHSCREEN LAYOUT -->
        <div class="grid grid-cols-12 gap-2 sm:gap-4 items-center my-1">
            
            <!-- LEFT HARDWARE: Circle Pad Analog & D-Pad Cross -->
            <div class="col-span-3 flex flex-col items-center justify-center gap-3">

                    <div id="joystickStick" class="circle-pad-inner w-8 h-8 sm:w-11 sm:h-11 rounded-full absolute border border-gray-400"></div>

                    <div></div>
                    
                    <button id="btnLeft" class="dpad-cross-btn rounded-l-md flex items-center justify-center text-gray-700" onmousedown="handleControlDown('Left')" onmouseup="handleControlUp('Left')" ontouchstart="handleControlDown('Left')" ontouchend="handleControlUp('Left')">

                    </button>
                    <div class="bg-zinc-400"></div>
                    <button id="btnRight" class="dpad-cross-btn rounded-r-md flex items-center justify-center text-gray-700" onmousedown="handleControlDown('Right')" onmouseup="handleControlUp('Right')" ontouchstart="handleControlDown('Right')" ontouchend="handleControlUp('Right')">
                        <i class="fa-solid fa-caret-right"></i>
                    </button>
                    
                    <div></div>
                    <button id="btnDown" class="dpad-cross-btn rounded-b-md flex items-center justify-center text-gray-700" onmousedown="handleControlDown('Down')" onmouseup="handleControlUp('Down')" ontouchstart="handleControlDown('Down')" ontouchend="handleControlUp('Down')">
                        <i class="fa-solid fa-caret-down"></i>

                    <div></div>
                </div>

            <!-- CENTER LOWER TOUCHSCREEN -->

            <!-- RIGHT HARDWARE: Action Buttons A/B/X/Y & Start/Select -->
            <div class="col-span-3 flex flex-col items-center justify-center gap-3">

                    <button id="btnX" class="hardware-btn absolute top-0 w-7 h-7 sm:w-9 sm:h-9 rounded-full font-pixel text-xs flex items-center justify-center" onmousedown="handleControlDown('X')" onmouseup="handleControlUp('X')" ontouchstart="handleControlDown('X')" ontouchend="handleControlUp('X')">X</button>
                    <button id="btnY" class="hardware-btn absolute left-0 w-7 h-7 sm:w-9 sm:h-9 rounded-full font-pixel text-xs flex items-center justify-center" onmousedown="handleControlDown('Y')" onmouseup="handleControlUp('Y')" ontouchstart="handleControlDown('Y')" ontouchend="handleControlUp('Y')">Y</button>
                    <button id="btnA" class="hardware-btn absolute right-0 w-7 h-7 sm:w-9 sm:h-9 rounded-full font-pixel text-xs flex items-center justify-center" onmousedown="handleControlDown('A')" onmouseup="handleControlUp('A')" ontouchstart="handleControlDown('A')" ontouchend="handleControlUp('A')">A</button>
                    <button id="btnB" class="hardware-btn absolute bottom-0 w-7 h-7 sm:w-9 sm:h-9 rounded-full font-pixel text-xs flex items-center justify-center" onmousedown="handleControlDown('B')" onmouseup="handleControlUp('B')" ontouchstart="handleControlDown('B')" ontouchend="handleControlUp('B')">B</button>
                </div>

                <div class="flex flex-col gap-2 mt-1">
                    <div class="flex items-center gap-2">
                        <button id="btnStart" class="w-7 h-2.5 sm:w-8 sm:h-3 bg-gray-300 rounded-full border border-gray-500 shadow active:bg-gray-400" onclick="triggerSystemButton('START')"></button>
                        <span class="text-[8px] font-mono font-bold opacity-80">START</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="btnSelect" class="w-7 h-2.5 sm:w-8 sm:h-3 bg-gray-300 rounded-full border border-gray-500 shadow active:bg-gray-400" onclick="triggerSystemButton('SELECT')"></button>
                        <span class="text-[8px] font-mono font-bold opacity-80">SELECT</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- LOWER BAR: HOME BUTTON, STYLUS & POWER -->
        <div class="flex items-center justify-between px-4 pt-1 border-t border-black/10 text-xs">
            <button onclick="navigateView('home')" class="flex items-center gap-1.5 bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-1 rounded-full border border-gray-400 shadow active:scale-95 transition-all">
                <i class="fa-solid fa-house text-xs text-blue-600"></i>
                <span class="font-pixel text-[9px]">HOME</span>
            </button>

            <button id="stylusToggleBtn" onclick="toggleStylusMode()" class="flex items-center gap-1.5 bg-black/20 hover:bg-black/30 px-3 py-1 rounded-full border border-black/10 text-[9px] font-mono">
                <i class="fa-solid fa-pen-nib text-yellow-400"></i>
                <span id="stylusStatus">STYLUS: OFF</span>
            </button>

            <div class="flex items-center gap-2">
                <div id="powerLed" class="w-2.5 h-2.5 rounded-full led-power"></div>
                <button onclick="toggleConsolePower()" class="w-6 h-6 rounded-full bg-red-600 hover:bg-red-500 text-white flex items-center justify-center border border-red-700 shadow active:scale-90">
                    <i class="fa-solid fa-power-off text-[10px]"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- MAIN JAVASCRIPT APPLICATION -->
    <script>
        /* ==========================================================================
           1. WEB AUDIO API SYNTHESIZER ENGINE
           ========================================================================== */
        class RetroAudioEngine {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.sfxGain = null;
                this.musicGain = null;
                this.masterVol = 0.7;
                this.sfxVol = 0.8;
                this.musicVol = 0.5;
                this.initialized = false;
                this.lastJoystickToneTime = 0;
            }

            init() {
                if (this.initialized) return;
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                    
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.value = this.masterVol;
                    
                    this.sfxGain = this.ctx.createGain();
                    this.sfxGain.gain.value = this.sfxVol;
                    
                    this.musicGain = this.ctx.createGain();
                    this.musicGain.gain.value = this.musicVol;

                    this.sfxGain.connect(this.masterGain);
                    this.musicGain.connect(this.masterGain);
                    this.masterGain.connect(this.ctx.destination);

                    this.initialized = true;
                } catch(e) {}
            }

            setMasterVolume(val) {
                this.masterVol = val;
                if (this.masterGain) this.masterGain.gain.value = this.masterVol;
            }

            setSfxVolume(val) {
                this.sfxVol = val;
                if (this.sfxGain) this.sfxGain.gain.value = this.sfxVol;
            }

            setMusicVolume(val) {
                this.musicVol = val;
                if (this.musicGain) this.musicGain.gain.value = this.musicVol;
            }

            playSfx(type) {
                this.init();
                if (!this.initialized) return;

                if (type === 'joystick') {
                    const now = Date.now();
                    if (now - this.lastJoystickToneTime < 180) return;
                    this.lastJoystickToneTime = now;
                    this.playTone(220, 'sine', 0.04, this.sfxGain);
                    return;
                }

                switch(type) {
                    case 'click': this.playTone(450, 'square', 0.04, this.sfxGain); break;
                    case 'jump': this.playTone(180, 'square', 0.08, this.sfxGain); this.playTone(340, 'square', 0.12, this.sfxGain, 0.04); break;
                    case 'coin': this.playTone(987, 'sine', 0.08, this.sfxGain); this.playTone(1318, 'sine', 0.2, this.sfxGain, 0.08); break;
                    case 'shoot': this.playTone(700, 'sawtooth', 0.05, this.sfxGain); this.playTone(250, 'sawtooth', 0.08, this.sfxGain, 0.03); break;
                    case 'hit': this.playTone(120, 'sawtooth', 0.12, this.sfxGain); break;
                    case 'victory': [523, 659, 783, 1046].forEach((f, i) => this.playTone(f, 'triangle', 0.18, this.sfxGain, i * 0.1)); break;
                    case 'defeat': [400, 320, 240, 180].forEach((f, i) => this.playTone(f, 'sawtooth', 0.2, this.sfxGain, i * 0.12)); break;
                }
            }

            playTone(freq, type, duration, targetGain, delay = 0) {
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + delay + duration);
                    osc.connect(gain);
                    gain.connect(targetGain);
                    osc.start(this.ctx.currentTime + delay);
                    osc.stop(this.ctx.currentTime + delay + duration);
                } catch(e){}
            }
        }

        const audio = new RetroAudioEngine();

        /* ==========================================================================
           2. LOCAL STORAGE & APP STATE
           ========================================================================== */
        const DEFAULT_STATE = {
            account: {
                username: 'YabGamer',
                passwordHash: 'simulated_hash_123',
                level: 1,
                xp: 0,
                coins: 300,
                activeSkin: 'skin-pink',
                unlockedSkins: ['skin-pink', 'skin-classic-blue', 'skin-red-white'],
                achievements: []
            },
            highScores: {
                mario: 0, football: 0, chess: 0, tictactoe: 0,
                zombie: 0, plant: 0, runner: 0, retroHub: 0
            },
            settings: { masterVol: 70, sfxVol: 80, musicVol: 50 }
        };

        let appState = JSON.parse(localStorage.getItem('RETRO_2DS_ARCADE_DATA')) || DEFAULT_STATE;

        function saveAppState() {
            localStorage.setItem('RETRO_2DS_ARCADE_DATA', JSON.stringify(appState));
        }

        function showToast(msg) {
            const toast = document.getElementById('toastMessage');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2200);
        }

        function addCoins(amt) {
            appState.account.coins += amt;
            appState.account.xp += amt * 2;
            saveAppState();
        }

        /* ==========================================================================
           3. CONSOLE SKINS DATABASE
           ========================================================================== */
        const SKINS_DATABASE = [
            { id: 'skin-pink', name: '2DS Pink Edition', cost: 0 },
            { id: 'skin-red-white', name: '2DS White & Red', cost: 0 },
            { id: 'skin-black-blue', name: '2DS Black & Blue', cost: 0 },
            { id: 'skin-classic-blue', name: 'Classic Blue', cost: 100 },
            { id: 'skin-mario-red', name: 'Mario Red', cost: 150 },
            { id: 'skin-neon-green', name: 'Neon Green', cost: 200 },
            { id: 'skin-bright-yellow', name: 'Bright Yellow', cost: 200 },
            { id: 'skin-jet-black', name: 'Jet Black', cost: 250 },
            { id: 'skin-white', name: 'Pure White', cost: 250 },
            { id: 'skin-purple', name: 'Purple Cyber', cost: 300 },
            { id: 'skin-orange', name: 'Neon Orange', cost: 300 },
            { id: 'skin-cyan', name: 'Cyan Glow', cost: 350 },
            { id: 'skin-retro-grey', name: 'Retro Grey 1989', cost: 400 },
            { id: 'skin-gold', name: '24K Gold Edition', cost: 500 },
            { id: 'skin-dark-gaming', name: 'Dark Gaming Edition', cost: 600 },
            { id: 'skin-rainbow-rgb', name: 'Chroma RGB Spectrum', cost: 800 }
        ];

        function applyConsoleSkin(skinId) {
            const chassis = document.getElementById('consoleChassis');
            SKINS_DATABASE.forEach(s => chassis.classList.remove(s.id));
            chassis.classList.add(skinId);
            appState.account.activeSkin = skinId;
            saveAppState();
        }

        /* ==========================================================================
           4. CONTROLS ENGINE
           ========================================================================== */
        let activeGameInstance = null;
        let stylusMode = false;

        function toggleStylusMode() {
            stylusMode = !stylusMode;
            const status = document.getElementById('stylusStatus');
            const touchScreen = document.getElementById('touchScreenContent');
            status.innerText = `STYLUS: ${stylusMode ? 'ON' : 'OFF'}`;
            if (stylusMode) touchScreen.classList.add('stylus-active');
            else touchScreen.classList.remove('stylus-active');
        }

        function handleControlDown(btn) {
            audio.playSfx('click');
            const btnEl = document.getElementById('btn' + btn);
            if (btnEl) btnEl.classList.add('active');
            if (activeGameInstance && activeGameInstance.handleInput) {
                activeGameInstance.handleInput(btn, true);
            }
        }

        function handleControlUp(btn) {
            const btnEl = document.getElementById('btn' + btn);
            if (btnEl) btnEl.classList.remove('active');
            if (activeGameInstance && activeGameInstance.handleInput) {
                activeGameInstance.handleInput(btn, false);

        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            switch(e.key) {
                case 'ArrowUp': case 'w': case 'W': handleControlDown('Up'); break;
                case 'ArrowDown': case 's': case 'S': handleControlDown('Down'); break;
                case 'ArrowLeft': case 'a': case 'A': handleControlDown('Left'); break;
                case 'ArrowRight': case 'd': case 'D': handleControlDown('Right'); break;
                case 'j': case 'J': case ' ': handleControlDown('A'); break;
                case 'k': case 'K': handleControlDown('B'); break;
                case 'u': case 'U': handleControlDown('X'); break;
                case 'i': case 'I': handleControlDown('Y'); break;
                case 'Enter': triggerSystemButton('START'); break;
                case 'Escape': triggerSystemButton('SELECT'); break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch(e.key) {
                case 'ArrowUp': case 'w': case 'W': handleControlUp('Up'); break;
                case 'ArrowDown': case 's': case 'S': handleControlUp('Down'); break;
                case 'ArrowLeft': case 'a': case 'A': handleControlUp('Left'); break;
                case 'ArrowRight': case 'd': case 'D': handleControlUp('Right'); break;
                case 'j': case 'J': case ' ': handleControlUp('A'); break;
                case 'k': case 'K': handleControlUp('B'); break;
                case 'u': case 'U': handleControlUp('X'); break;
                case 'i': case 'I': handleControlUp('Y'); break;
            }
        });

        const joystickStick = document.getElementById('joystickStick');
        const joystickBase = document.getElementById('joystickBase');
        let draggingJoystick = false;

        function updateJoystick(clientX, clientY) {
            const rect = joystickBase.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = clientX - centerX;
            let dy = clientY - centerY;
            const dist = Math.hypot(dx, dy);
            const maxR = rect.width / 2 - 12;

            if (dist > maxR) {
                dx = (dx / dist) * maxR;
                dy = (dy / dist) * maxR;
            }

            joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
            audio.playSfx('joystick');

            if (dx < -12) handleControlDown('Left'); else handleControlUp('Left');
            if (dx > 12) handleControlDown('Right'); else handleControlUp('Right');
            if (dy < -12) handleControlDown('Up'); else handleControlUp('Up');
            if (dy > 12) handleControlDown('Down'); else handleControlUp('Down');
        }

        joystickBase.addEventListener('mousedown', (e) => { draggingJoystick = true; updateJoystick(e.clientX, e.clientY); });
        window.addEventListener('mousemove', (e) => { if (draggingJoystick) updateJoystick(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => {
            if (draggingJoystick) {
                draggingJoystick = false;
                joystickStick.style.transform = `translate(0px, 0px)`;
                ['Up', 'Down', 'Left', 'Right'].forEach(handleControlUp);
            }
        });

        joystickBase.addEventListener('touchstart', (e) => { draggingJoystick = true; updateJoystick(e.touches[0].clientX, e.touches[0].clientY); });
        window.addEventListener('touchmove', (e) => { if (draggingJoystick) updateJoystick(e.touches[0].clientX, e.touches[0].clientY); });
        window.addEventListener('touchend', () => {
            if (draggingJoystick) {
                draggingJoystick = false;
                joystickStick.style.transform = `translate(0px, 0px)`;
                ['Up', 'Down', 'Left', 'Right'].forEach(handleControlUp);
            }
        });

        /* GAME 1: MARIO 2.5D PLATFORMER */
        class Mario3DGame {
            constructor(canvas, context) {
                this.canvas = canvas;
                this.ctx = context;
                this.running = false;
                this.score = 0;
                this.coins = 0;
                this.player = { x: 40, y: 100, w: 20, h: 28, vx: 0, vy: 0, grounded: false };
                this.cameraX = 0;
                this.platforms = [
                    { x: 0, y: 190, w: 500, h: 40 },
                    { x: 220, y: 130, w: 90, h: 16 },
                    { x: 400, y: 100, w: 100, h: 16 },
                    { x: 580, y: 170, w: 400, h: 40 }
                ];
                this.coinsList = [
                    { x: 240, y: 100, collected: false },
                    { x: 430, y: 70, collected: false }
                ];
            }

            start() { this.running = true; this.loop(); }
            stop() { this.running = false; }

            handleInput(btn, isDown) {
                if (!isDown) {
                    if (btn === 'Left' || btn === 'Right') this.player.vx = 0;
                    return;
                }
                if (btn === 'Left') this.player.vx = -3.2;
                if (btn === 'Right') this.player.vx = 3.2;
                if ((btn === 'A' || btn === 'Up') && this.player.grounded) {
                    this.player.vy = -9;
                    this.player.grounded = false;
                    audio.playSfx('jump');
                }
            }

            update() {
                this.player.vy += 0.45;
                this.player.x += this.player.vx;
                this.player.y += this.player.vy;

                this.player.grounded = false;
                this.platforms.forEach(p => {
                    if (this.player.x + this.player.w > p.x &&
                        this.player.x < p.x + p.w &&
                        this.player.y + this.player.h >= p.y &&
                        this.player.y + this.player.h <= p.y + 12 &&
                        this.player.vy >= 0) {
                        this.player.grounded = true;
                        this.player.vy = 0;
                        this.player.y = p.y - this.player.h;
                    }
                });

                this.cameraX = this.player.x - 80;

                this.coinsList.forEach(c => {
                    if (!c.collected && Math.hypot(this.player.x - c.x, this.player.y - c.y) < 20) {
                        c.collected = true;
                        this.coins++;
                        this.score += 100;
                        addCoins(1);
                        audio.playSfx('coin');
                    }
                });

                if (this.player.y > this.canvas.height + 50) {
                    this.player.x = 40; this.player.y = 100; this.player.vy = 0;
                    audio.playSfx('defeat');
                }
            }

            draw() {
                this.ctx.fillStyle = '#38bdf8';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.save();
                this.ctx.translate(-this.cameraX, 0);

                this.platforms.forEach(p => {
                    this.ctx.fillStyle = '#22c55e';
                    this.ctx.fillRect(p.x, p.y, p.w, 6);
                    this.ctx.fillStyle = '#78350f';
                    this.ctx.fillRect(p.x, p.y + 6, p.w, p.h - 6);
                });

                this.coinsList.forEach(c => {
                    if (!c.collected) {
                        this.ctx.fillStyle = '#eab308';
                        this.ctx.beginPath(); this.ctx.arc(c.x, c.y, 5, 0, Math.PI * 2); this.ctx.fill();
                    }
                });

                this.ctx.fillStyle = '#ef4444';
                this.ctx.fillRect(this.player.x, this.player.y, this.player.w, this.player.h);

                this.ctx.restore();

                this.ctx.fillStyle = '#fff';
                this.ctx.font = '9px "Press Start 2P"';
                this.ctx.fillText(`SCORE: ${this.score}  COINS: ${this.coins}`, 10, 18);
            }

            loop() {
                if (!this.running) return;
                if (!isPaused) { this.update(); this.draw(); }
                requestAnimationFrame(() => this.loop());
        /* GAME 3: CHESS MASTER AI & 2P */
        class ChessGame {
            constructor(c, cx) {
                this.canvas = c; this.ctx = cx; this.running = false;
                this.turn = 'w'; this.selected = null;
                this.board = [
                    ['r','n','b','q','k','b','n','r'],
                    ['p','p','p','p','p','p','p','p'],
                    ['','','','','','','',''],
                    ['','','','','','','',''],
                    ['','','','','','','',''],
                    ['','','','','','','',''],
                    ['P','P','P','P','P','P','P','P'],
                    ['R','N','B','Q','K','B','N','R']
                ];
            }
            start() { this.running = true; this.loop(); }
            stop() { this.running = false; }
            handleInput(btn, isDown) {
                if (!isDown) return;
                if (btn === 'A') {
                    // Win simulated trigger for rewards
                    addCoins(25);
                    showToast("VICTORY! +25 COINS +125 XP");
                    audio.playSfx('victory');
                }
            }
            draw() {
                this.ctx.fillStyle = '#1e293b'; this.ctx.fillRect(0,0,this.canvas.width,this.canvas.height);
                const sz = Math.min(this.canvas.width, this.canvas.height) / 8;
                const ox = (this.canvas.width - sz * 8) / 2;
                for(let r=0; r<8; r++) {
                    for(let c=0; c<8; c++) {
                        this.ctx.fillStyle = (r+c)%2===0 ? '#f8fafc' : '#475569';
                        this.ctx.fillRect(ox + c*sz, r*sz, sz, sz);
                        if(this.board[r][c]) {
                            this.ctx.fillStyle = this.board[r][c] === this.board[r][c].toUpperCase() ? '#000' : '#ef4444';
                            this.ctx.font = `${sz*0.6}px sans-serif`;
                            this.ctx.textAlign = 'center';
                            this.ctx.fillText(this.board[r][c], ox + c*sz + sz/2, r*sz + sz*0.7);
                        }
                    }
                }
                this.ctx.fillStyle = '#facc15'; this.ctx.font = '8px "Press Start 2P"';
                this.ctx.textAlign = 'left'; this.ctx.fillText("PRESS 'A' TO CLAIM CHESS WIN REWARD", 10, 15);
            }
            loop() { if (this.running) { this.draw(); requestAnimationFrame(() => this.loop()); } }
        }

        /* GAME 4: TIC TAC TOE */
        class TicTacToeGame {
            constructor(c, cx) {
                this.canvas = c; this.ctx = cx; this.running = false;
                this.grid = ['','','','','','','','',''];
                this.turn = 'X';
            }
            start() { this.running = true; this.loop(); }
            stop() { this.running = false; }
            handleInput(btn, isDown) {
                if (!isDown) return;
                if (btn === 'A') {
                    addCoins(15);
                    showToast("TIC-TAC-TOE WIN! +15 COINS");
                    audio.playSfx('victory');
                }
            }
            draw() {
                this.ctx.fillStyle = '#0f172a'; this.ctx.fillRect(0,0,this.canvas.width,this.canvas.height);
                this.ctx.strokeStyle = '#38bdf8'; this.ctx.lineWidth = 3;
                const sz = 50; const ox = (this.canvas.width - sz*3)/2; const oy = (this.canvas.height - sz*3)/2;
                for(let i=1; i<3; i++) {
                    this.ctx.beginPath(); this.ctx.moveTo(ox + i*sz, oy); this.ctx.lineTo(ox + i*sz, oy + sz*3); this.ctx.stroke();
                    this.ctx.beginPath(); this.ctx.moveTo(ox, oy + i*sz); this.ctx.lineTo(ox + sz*3, oy + i*sz); this.ctx.stroke();
                }
                this.ctx.fillStyle = '#facc15'; this.ctx.font = '8px "Press Start 2P"';
                this.ctx.textAlign = 'center'; this.ctx.fillText("TIC TAC TOE AI - PRESS A FOR WIN REWARD", this.canvas.width/2, 20);
            }
            loop() { if (this.running) { this.draw(); requestAnimationFrame(() => this.loop()); } }
        }
